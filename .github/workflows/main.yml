name: Build AmneziaWG for MikroTik ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Code via Makefile
        run: |
          # Используем готовое Docker-окружение для сборки Go-кода под arm64
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e GOOS=linux \
            -e GOARCH=arm64 \
            golang:1.22-alpine \
            sh -c "apk add --no-cache make git && make build-go"

      - name: Create Final Dockerfile
        run: |
          # Собираем минимальный и правильный контейнер для MikroTik
          echo "FROM alpine:3.19" > Dockerfile
          echo "RUN apk add --no-cache iptables iproute2 wireguard-tools" >> Dockerfile
          echo "COPY amneziawg-go /usr/bin/amneziawg-go" >> Dockerfile
          echo "COPY entrypoint.sh /entrypoint.sh" >> Dockerfile
          echo "RUN chmod +x /entrypoint.sh /usr/bin/amneziawg-go" >> Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Assemble Tar Archive with Manifest
        run: |
          docker buildx build \
            --platform linux/arm64/v8 \
            --output type=docker \
            --tag amnezia-wg-mikrotik:latest \
            .

      - name: Save Archive for MikroTik
        run: |
          docker save amnezia-wg-mikrotik:latest -o awg-correct-arm64.tar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-mikrotik-arm64
          path: awg-correct-arm64.tar
