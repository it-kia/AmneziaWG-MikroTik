name: Build AmneziaWG for MikroTik ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Temporary Docker Context
        run: |
          # Создаем пустой Dockerfile, так как нам нужна просто файловая система проекта
          echo "FROM scratch" > Dockerfile
          echo "COPY . /" >> Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Valid Image with Manifest
        run: |
          docker buildx build \
            --platform linux/arm64/v8 \
            --output type=docker \
            --tag amnezia-wg-mikrotik:latest \
            .

      - name: Save Correnct Tar for MikroTik
        run: |
          docker save amnezia-wg-mikrotik:latest -o awg-correct-arm64.tar

      - name: Upload Finished Tar to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-mikrotik-arm64
          path: awg-correct-arm64.tar
