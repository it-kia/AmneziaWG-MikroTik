name: Build AmneziaWG for MikroTik ARM64

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image for ARM64
        run: |
          docker buildx build \
            --platform linux/arm64/v8 \
            --output type=docker \
            --tag amnezia-wg-mikrotik:latest \
            .

      - name: Save Docker Image to Tar Archive
        run: |
          docker save amnezia-wg-mikrotik:latest -o awg-correct-arm64.tar

      - name: Upload Finished Tar to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-mikrotik-arm64
          path: awg-correct-arm64.tar
